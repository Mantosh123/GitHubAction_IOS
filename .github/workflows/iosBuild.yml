
name: iOS Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test iOS App
    runs-on: xcode-27
    defaults:
      run:
        working-directory: GitHub_Action_IOSDemo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Show Xcode project and schemes
        run: |
          ls -la
          xcodebuild -list \
            -project GitHub_Action_IOSDemo.xcodeproj

      - name: Build iOS app
        run: |
          xcodebuild \
            -project GitHub_Action_IOSDemo.xcodeproj \
            -scheme GitHub_Action_IOSDemo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test iOS app
              working-directory: GitHub_Action_IOSDemo
        run: |
          xcodebuild \
            -project GitHub_Action_IOSDemo.xcodeproj \
            -scheme GitHub_Action_IOSDemo \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            CODE_SIGNING_ALLOWED=NO \
            test



